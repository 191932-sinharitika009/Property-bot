name: Verify application and Docker image
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run evaluate:retrieval
      - run: docker build -t property-chatbot:test .
      - name: Verify container health and private-file exclusion
        shell: bash
        run: |
          docker run -d --name property-chatbot-test -p 8000:8000 property-chatbot:test
          trap 'docker rm -f property-chatbot-test' EXIT
          curl --fail --retry 10 --retry-delay 2 --retry-connrefused http://localhost:8000/health
          docker exec property-chatbot-test sh -c 'test ! -e /app/.env && test ! -d /app/data/wasalt && test ! -d /app/data/darglobal'
